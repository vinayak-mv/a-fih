name: Windows preview

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')))
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Kotlin modules
        shell: pwsh
        run: ./gradlew.bat --no-daemon :shared:jvmTest :desktopApp:test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            shared/build/reports/tests/
            desktopApp/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
  telegram-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Pinned prebuilt Telegram runtime (tdjson.dll + licenses/) published as a GitHub Release asset.
      # Produce once from the pinned TDLib/vcpkg revisions, upload the zip + SHA256, then set these values.
      # Previous build pins: TD_REVISION=ea3f69ce11aef458bfbb09869b809ede4447486f VCPKG_REVISION=817892b0ecbc6af994dd6df999c73faf795adbf2
      TELEGRAM_RUNTIME_TAG: telegram-runtime-TODO
      TELEGRAM_RUNTIME_ASSET: telegram-runtime-windows-x64.zip
      TELEGRAM_RUNTIME_SHA256: TODO
    steps:
      - name: Download prebuilt Telegram runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TELEGRAM_RUNTIME_TAG -eq 'telegram-runtime-TODO' -or $env:TELEGRAM_RUNTIME_SHA256 -eq 'TODO') {
            throw 'Set TELEGRAM_RUNTIME_TAG, TELEGRAM_RUNTIME_ASSET, and TELEGRAM_RUNTIME_SHA256 to a published prebuilt runtime release asset.'
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TELEGRAM_RUNTIME_TAG/$env:TELEGRAM_RUNTIME_ASSET"
          $zip = Join-Path $env:RUNNER_TEMP 'telegram-runtime.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $env:TELEGRAM_RUNTIME_SHA256.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Telegram runtime checksum mismatch: expected $expected, got $actual" }
          New-Item -ItemType Directory -Force -Path native/windows-x64 | Out-Null
          Expand-Archive -Path $zip -DestinationPath native/windows-x64 -Force
          if (!(Test-Path native/windows-x64/tdjson.dll)) { throw 'Prebuilt runtime archive must contain tdjson.dll at the archive root' }
          if (!(Test-Path native/windows-x64/licenses)) { throw 'Prebuilt runtime archive must contain a licenses/ directory at the archive root' }
      - name: Upload Telegram runtime
        uses: actions/upload-artifact@v4
        with:
          name: telegram-runtime-${{ github.run_number }}
          path: native/windows-x64/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: [checks, telegram-runtime]
    if: always() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') && needs.telegram-runtime.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Download Telegram runtime
        uses: actions/download-artifact@v4
        with:
          name: telegram-runtime-${{ github.run_number }}
          path: native/windows-x64
      - name: Check native library loads and exports its JSON API
        shell: pwsh
        run: |
          $libraryPath = (Resolve-Path 'native/windows-x64/tdjson.dll').Path
          $handle = [System.Runtime.InteropServices.NativeLibrary]::Load($libraryPath)
          try {
            foreach ($symbol in @('td_json_client_create', 'td_json_client_send', 'td_json_client_receive', 'td_json_client_destroy', 'td_json_client_execute')) {
              [void][System.Runtime.InteropServices.NativeLibrary]::GetExport($handle, $symbol)
            }
          } finally {
            [System.Runtime.InteropServices.NativeLibrary]::Free($handle)
          }
      - name: Restore player runtime
        id: player-cache
        uses: actions/cache@v4
        with:
          path: native/windows-x64/mpv
          key: mpv-windows-x64-${{ hashFiles('scripts/prepare-player.ps1') }}
      - name: Prepare bundled player
        if: steps.player-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/prepare-player.ps1
      - name: Exercise bundled native player
        shell: pwsh
        run: ./gradlew.bat --no-daemon :desktopApp:playerSmoke
      - name: Package portable application
        shell: pwsh
        run: ./gradlew.bat --no-daemon :desktopApp:createDistributable
      - name: Upload unsigned portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: a-Fih-windows-x64-preview-${{ github.run_number }}
          path: desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 14
